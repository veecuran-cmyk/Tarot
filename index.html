<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090214;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1f1033 0%, #090214 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold: #cfaa6e;
            --gold-glow: #e6c891;
            --text-main: #e0e0e0;
            --card-back: #1a0f2e;
            --danger: #ff5f5f;
            --success: #4caf50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--gold); }

        /* --- NAV BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px rgba(207, 170, 110, 0.3); }

        .menu-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 20px;
            margin-left: 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cinzel', serif;
        }

        .menu-btn:hover { background: var(--gold); color: var(--bg-dark); box-shadow: 0 0 15px var(--gold); }

        /* --- MESA PRINCIPAL --- */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow-y: auto;
            padding: 20px;
        }

        /* Deck Central (Animação Shuffle) */
        #deck-stack {
            position: absolute;
            width: 140px;
            height: 220px;
            background: var(--card-back);
            border: 2px solid var(--gold);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }

        #deck-stack::before, #deck-stack::after {
            content: ''; position: absolute; top: -5px; left: -5px;
            width: 100%; height: 100%;
            border: 2px solid var(--gold); border-radius: 10px;
            background: var(--card-back); z-index: -1;
        }
        #deck-stack::before { transform: rotate(3deg); }
        #deck-stack::after { transform: rotate(-3deg); }

        .shuffling { animation: shuffleAnim 0.8s ease-in-out infinite; }

        @keyframes shuffleAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 0) rotate(-5deg); }
            50% { transform: translate(10px, 0) rotate(5deg); }
            75% { transform: translate(-5px, 0) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Área das Cartas Distribuídas */
        #spread-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            opacity: 0;
            transition: opacity 1s;
        }
        #spread-area.visible { opacity: 1; }

        /* A Carta Individual */
        .card {
            width: 130px;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--gold);
        }

        .card-back {
            background: var(--card-back);
            background-image: repeating-linear-gradient(45deg, rgba(207, 170, 110, 0.05) 0px, rgba(207, 170, 110, 0.05) 2px, transparent 2px, transparent 10px);
            color: var(--gold);
            font-size: 2rem;
        }

        .card-front {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            color: #222;
            transform: rotateY(180deg);
            padding: 10px;
        }

        .card-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .card-name { font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; color: #1a0f2e; }
        .card-keyword { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        /* --- MODAIS (Pop-ups) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-box {
            background: #1a0f2e;
            border: 1px solid var(--gold);
            width: 90%; max-width: 500px;
            border-radius: 12px;
            padding: 25px;
            position: relative;
            box-shadow: 0 0 40px rgba(207, 170, 110, 0.1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-modal { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }
        .close-modal:hover { color: var(--gold); }

        /* Estilos dentro dos Modais */
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .setup-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #ccc; padding: 15px; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .setup-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(207, 170, 110, 0.1); }
        
        .history-item { 
            background: rgba(255,255,255,0.03); 
            border-left: 3px solid var(--gold); 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 0 8px 8px 0;
        }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.8rem; color: #888; }
        .history-cards { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .mini-card { background: #eee; color: #222; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        
        textarea.note-editor {
            width: 100%; height: 80px;
            background: rgba(0,0,0,0.3); border: 1px solid #444; color: #fff;
            padding: 10px; border-radius: 5px; margin-top: 10px; resize: vertical;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end; }
        .btn-save { background: var(--gold); color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-delete { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 8px 15px; cursor: pointer; border-radius: 4px; }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Card Detail Modal */
        .detail-large-icon { font-size: 6rem; text-align: center; margin: 20px 0; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Custom Input */
        .custom-setup { grid-column: span 2; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .custom-setup input { background: transparent; border: 1px solid var(--gold); color: white; padding: 5px; width: 60px; text-align: center; }

    </style>
</head>

        ];

        // --- VARIÁVEIS DE ESTADO ---
        let currentReading = [];

        // --- FUNÇÕES DE MODAL ---
        function openSetup() {
            document.getElementById('modal-setup').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openHistory() {
            renderHistory();
            document.getElementById('modal-history').classList.add('active');
        }

        // --- LÓGICA DE EMBARALHAMENTO E TIRAGEM ---
        function startShuffling(count) {
            closeModal('modal-setup');
            
            const spreadArea = document.getElementById('spread-area');
            const deckStack = document.getElementById('deck-stack');

            // Reset visual
            spreadArea.innerHTML = '';
            spreadArea.classList.remove('visible');
            deckStack.style.display = 'flex';
            
            // Animação de Shuffle
            deckStack.classList.add('shuffling');

            setTimeout(() => {
                deckStack.classList.remove('shuffling');
                deckStack.style.display = 'none'; // Esconde o deck central
                dealCards(parseInt(count));
            }, 1500); // 1.5s de embaralhamento
        }

        function dealCards(count) {
            const spreadArea = document.getElementById('spread-area');
            
            // Lógica de sorteio
            let deckCopy = [...tarotData];
            deckCopy.sort(() => Math.random() - 0.5);
            currentReading = deckCopy.slice(0, count);

            // Gerar HTML das cartas
            currentReading.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back">☾</div>
                        <div class="card-face card-front">
                            <div class="card-icon">${card.icon}</div>
                            <div class="card-name">${card.name}</div>
                            <div class="card-keyword">${card.key}</div>
                        </div>
                    </div>
                `;
                // Clique para revelar
                el.onclick = () => revealCard(el, card, index);
                spreadArea.appendChild(el);
            });

            // Fade in da área
            setTimeout(() => spreadArea.classList.add('visible'), 100);

            // Salvar no histórico automaticamente (como rascunho inicial)
            saveReadingToHistory(currentReading);
        }

        function revealCard(element, card, index) {
            if (element.classList.contains('flipped')) {
                // Se já está virada, abre os detalhes (Pop-up)
                showCardDetail(card);
            } else {
                // Vira a carta
                element.classList.add('flipped');
                // Pequeno delay para mostrar o pop-up automaticamente na primeira virada?
                // O usuário pediu "pop-up para as cartas que apareceram".
                // Vamos mostrar o detalhe automaticamente após a animação de virada (600ms)
                setTimeout(() => {
                    showCardDetail(card);
                }, 700);
            }
        }

        function showCardDetail(card) {
            document.getElementById('view-card-name').innerText = card.name;
            document.getElementById('view-card-icon').innerText = card.icon;
            document.getElementById('view-card-desc').innerText = card.desc;
            document.getElementById('modal-card').classList.add('active');
        }

        // --- SISTEMA DE HISTÓRICO E NOTAS (STORAGE) ---
        
        function getHistory() {
            return JSON.parse(localStorage.getItem('arcanum_history')) || [];
        }

        function saveReadingToHistory(cards) {
            const history = getHistory();
            const newEntry = {
                id: Date.now(),
                date: new Date().toLocaleString('pt-BR'),
                cards: cards,
                notes: "" // Nota vazia inicialmente
            };
        history.unshift(newEntry); // Adiciona no topo
            localStorage.setItem('arcanum_history', JSON.stringify(history));
        }

        function updateNote(id) {
            const history = getHistory();
            const noteText = document.getElementById(`note-${id}`).value;
            
            const index = history.findIndex(h => h.id === id);
            if (index !== -1) {
                history[index].notes = noteText;
                localStorage.setItem('arcanum_history', JSON.stringify(history));
                alert("Anotação salva com sucesso!");
            }
        }

        function deleteEntry(id) {
            if(confirm("Tem certeza que deseja apagar este registro?")) {
                let history = getHistory();
                history = history.filter(h => h.id !== id);
                localStorage.setItem('arcanum_history', JSON.stringify(history));
                renderHistory(); // Atualiza a lista
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = getHistory();
            
            list.innerHTML = '';

            if (history.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">Nenhuma leitura gravada ainda.</p>';
                return;
            }

            history.forEach(entry => {
                // Criar mini visualização das cartas
                let cardsHtml = '';
                entry.cards.forEach(c => {
                    cardsHtml += `<span class="mini-card" title="${c.name}">${c.icon} ${c.name}</span>`;
                });

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-header">
                        <span>📅 ${entry.date}</span>
                        <span>${entry.cards.length} Cartas</span>
                    </div>
                    <div class="history-cards">
                        ${cardsHtml}
                    </div>
                    <label style="font-size:0.8rem; color:var(--gold);">Suas Anotações:</label>
                    <textarea id="note-${entry.id}" class="note-editor" placeholder="Escreva aqui suas impressões sobre esta tiragem...">${entry.notes}</textarea>
                    <div class="btn-group">
                        <button class="btn-delete" onclick="deleteEntry(${entry.id})">Apagar</button>
                        <button class="btn-save" onclick="updateNote(${entry.id})">Salvar Nota</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

    </script>
